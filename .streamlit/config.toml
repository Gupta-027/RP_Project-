# Force a plain white light theme, whatever the browser or OS is set to.
[theme]
base = "light"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F4F7FC"
textColor = "#14283E"
primaryColor = "#2A6BD4"
borderColor = "#E1E7EF"
showSidebarBorder = true

[server]
headless = true

[browser]
gatherUsageStats = false
